name: Deploy to Netlify

on:
  push:
    branches: [ develop ]  # 按需调整分支
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout-检出代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # 改为 npm 缓存

      - name: Install dependencies
        run: npm ci  # 使用 npm 安装（更严格，适合 CI）

      - name: Build project
        run: npm run build

      # 5. 部署到 Netlify（官方推荐方式）
      - name: Deploy to Netlify-部署
        uses: nwtgck/actions-netlify@v2.1
        with:
          args: deploy --dir=dist --prod --site-id=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
